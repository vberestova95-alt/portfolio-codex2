<svg width="1760" height="1060" viewBox="0 0 1760 1060" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #FFFFFF; stroke: #D9DFEA; stroke-width: 2; }
    .node { fill: #FBFCFF; stroke: #CFD6E4; stroke-width: 2; }
    .line { stroke: #B7C0CF; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .accent { fill: #2550FF; }
    .title { fill: #0D1117; font-family: Manrope, Arial, sans-serif; font-size: 68px; font-weight: 700; letter-spacing: -0.04em; }
    .subtitle { fill: #667085; font-family: Manrope, Arial, sans-serif; font-size: 20px; font-weight: 500; }
    .heading { fill: #0D1117; font-family: Manrope, Arial, sans-serif; font-size: 20px; font-weight: 600; }
    .item { fill: #475467; font-family: Manrope, Arial, sans-serif; font-size: 14px; font-weight: 500; }
    .note-label { fill: #2550FF; font-family: Manrope, Arial, sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
    .note-copy { fill: #475467; font-family: Manrope, Arial, sans-serif; font-size: 16px; font-weight: 500; }
  </style>

  <rect class="bg" x="24" y="24" width="1712" height="1012" rx="28"/>

  <text class="title" x="74" y="116">New Onboarding Flowchart</text>
  <text class="subtitle" x="74" y="154">A shorter route to value, with verification deferred until users already have partial product access.</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10V0Z" fill="#B7C0CF"/>
    </marker>
  </defs>

  <g>
    <path class="line" d="M220 510H290" marker-end="url(#arrow)"/>
    <path class="line" d="M400 650V698" marker-end="url(#arrow)"/>
    <path class="line" d="M480 746H590V510" marker-end="url(#arrow)"/>
    <path class="line" d="M790 510H900" marker-end="url(#arrow)"/>
    <path class="line" d="M1010 566V646" marker-end="url(#arrow)"/>
    <path class="line" d="M1010 760V840" marker-end="url(#arrow)"/>
    <path class="line" d="M1270 892H1450V566" marker-end="url(#arrow)"/>
    <path class="line" d="M1560 622V702" marker-end="url(#arrow)"/>
  </g>

  <g transform="translate(70 466)">
    <rect class="node" width="150" height="88" rx="18"/>
    <text class="heading" x="18" y="42">Register</text>
    <text class="item" x="18" y="66">- Email</text>
  </g>

  <g transform="translate(290 412)">
    <rect class="node" width="220" height="238" rx="20"/>
    <text class="heading" x="20" y="34">Step 1 / Create account</text>
    <text class="item" x="20" y="66">- First name</text>
    <text class="item" x="20" y="90">- Last name</text>
    <text class="item" x="20" y="114">- Email address</text>
    <text class="item" x="20" y="138">- Password / confirm</text>
    <text class="item" x="20" y="162">- Country of residence</text>
    <text class="item" x="20" y="186">- Privacy policy</text>
    <text class="item" x="20" y="210">- Terms of service</text>
  </g>

  <g transform="translate(290 698)">
    <rect class="node" width="190" height="94" rx="18"/>
    <text class="heading" x="20" y="36">Verify email</text>
    <text class="item" x="20" y="62">- Code</text>
  </g>

  <g transform="translate(590 460)">
    <rect class="node" width="200" height="104" rx="20"/>
    <text class="heading" x="20" y="36">Dashboard</text>
    <text class="item" x="20" y="66">- Partial access</text>
    <text class="item" x="20" y="90">- Trading accounts</text>
  </g>

  <g transform="translate(900 460)">
    <rect class="node" width="220" height="106" rx="20"/>
    <text class="heading" x="20" y="36">Section 1 / Personal details</text>
    <text class="item" x="20" y="66">- Country code</text>
    <text class="item" x="20" y="90">- Phone number</text>
  </g>

  <g transform="translate(900 646)">
    <rect class="node" width="220" height="114" rx="20"/>
    <text class="heading" x="20" y="36">Date of birth</text>
    <text class="item" x="20" y="66">- Day / month / year</text>
    <text class="item" x="20" y="90">- Back / Next</text>
  </g>

  <g transform="translate(900 840)">
    <rect class="node" width="220" height="114" rx="20"/>
    <text class="heading" x="20" y="36">Upload ID</text>
    <text class="item" x="20" y="66">- Identity document</text>
    <text class="item" x="20" y="90">- eKYC module</text>
  </g>

  <g transform="translate(1160 840)">
    <rect class="node" width="190" height="114" rx="20"/>
    <text class="heading" x="20" y="36">Liveness check</text>
    <text class="item" x="20" y="66">- Selfie / motion check</text>
    <text class="item" x="20" y="90">- eKYC module</text>
  </g>

  <g transform="translate(1450 516)">
    <rect class="node" width="230" height="126" rx="20"/>
    <text class="heading" x="20" y="36">Section 2 / Proof of address</text>
    <text class="item" x="20" y="66">- Address line</text>
    <text class="item" x="20" y="90">- Country and ZIP code</text>
    <text class="item" x="20" y="114">- PO box if relevant</text>
  </g>

  <g transform="translate(1450 702)">
    <rect class="node" width="230" height="94" rx="20"/>
    <text class="heading" x="20" y="36">Upload POA document</text>
    <text class="item" x="20" y="62">- Utility bill / bank statement</text>
  </g>

  <g transform="translate(1190 244)">
    <circle class="accent" cx="16" cy="16" r="6"/>
    <text class="note-label" x="40" y="22">Access first</text>
    <text class="note-copy" x="40" y="52">Users reach the dashboard before the rest of the KYC flow.</text>
  </g>
</svg>
