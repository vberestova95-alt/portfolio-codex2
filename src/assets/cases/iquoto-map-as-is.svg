  <g transform="translate(1110 826)">
    <rect class="node" width="180" height="118" rx="20"/>
    <text class="heading" x="20" y="36">Account type</text>
    <text class="item" x="20" y="66">- Choose account type</text>
    <text class="item" x="20" y="90">- Set leverage</text>
  </g>

  <g transform="translate(1280 384)">
    <rect class="node" width="180" height="90" rx="20"/>
    <text class="heading" x="20" y="36">Step 5 / Legal</text>
    <text class="item" x="20" y="62">- Legal confirmations</text>
  </g>

