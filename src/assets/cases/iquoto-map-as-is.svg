<svg width="1760" height="1540" viewBox="0 0 1760 1540" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #FFFFFF; stroke: #D9DFEA; stroke-width: 2; }
    .node { fill: #FBFCFF; stroke: #CFD6E4; stroke-width: 2; }
    .line { stroke: #B7C0CF; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .title { fill: #0D1117; font-family: Manrope, Arial, sans-serif; font-size: 68px; font-weight: 700; letter-spacing: -0.04em; }
    .subtitle { fill: #667085; font-family: Manrope, Arial, sans-serif; font-size: 20px; font-weight: 500; }
    .heading { fill: #0D1117; font-family: Manrope, Arial, sans-serif; font-size: 20px; font-weight: 600; }
    .item { fill: #475467; font-family: Manrope, Arial, sans-serif; font-size: 14px; font-weight: 500; }
  </style>

  <rect class="bg" x="24" y="24" width="1712" height="1492" rx="28"/>

