    <text class="item" x="20" y="114">- Postal code / ZIP code</text>
    <text class="item" x="20" y="138">- Country of residence</text>
    <text class="item" x="20" y="162">- Length of stay at address</text>
    <text class="item" x="20" y="186">- Back / Next</text>
