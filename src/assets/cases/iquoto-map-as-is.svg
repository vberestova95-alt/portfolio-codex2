    <text class="heading" x="20" y="34">Step 1 / Create account</text>
    <text class="item" x="20" y="66">- First name</text>
    <text class="item" x="20" y="90">- Last name</text>
    <text class="item" x="20" y="114">- Email address</text>
    <text class="item" x="20" y="138">- Password / confirm</text>
    <text class="item" x="20" y="162">- Country of residence</text>
    <text class="item" x="20" y="186">- Privacy policy</text>
    <text class="item" x="20" y="210">- Terms of service</text>
