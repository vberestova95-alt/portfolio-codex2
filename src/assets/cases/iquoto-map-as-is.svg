    <path class="line" d="M1370 630V692" marker-end="url(#arrow)"/>
    <path class="line" d="M1460 438H1540" marker-end="url(#arrow)"/>
    <path class="line" d="M1640 438V286" marker-end="url(#arrow)"/>
    <path class="line" d="M1370 438V286H1540" marker-end="url(#arrow)"/>
