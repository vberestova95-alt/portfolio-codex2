  <g transform="translate(1540 228)">
    <rect class="node" width="170" height="114" rx="20"/>
    <text class="heading" x="20" y="36">KYC</text>
    <text class="item" x="20" y="66">- Identity document</text>
    <text class="item" x="20" y="90">- Proof of address</text>
