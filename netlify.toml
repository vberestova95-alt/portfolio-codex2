[build]
  command = "npm run build"
  publish = "dist"

# This Netlify site only ever serves the standalone case, so the flag is set for
# every context — a deploy preview that built the full portfolio would still hit
# the redirects below and land on a page the build had routed away from.
[build.environment]
  VITE_CASE_ONLY = "true"

[[redirects]]
  from = "/"
  to = "/pet-injection-tracker"
  status = 302

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
